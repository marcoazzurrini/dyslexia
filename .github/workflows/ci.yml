name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  WRANGLER_SEND_METRICS: "false"

jobs:
  static:
    name: Static checks and unit tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test

  e2e:
    name: Browser tests (${{ matrix.project }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    # Browsers and their system libraries come in the image. Its version must
    # match @playwright/test in apps/web/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile-webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      # setup-bun unpacks Bun with unzip, which the image lacks.
      - run: apt-get update -qq && apt-get install -qq -y --no-install-recommends unzip
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx playwright test --project=${{ matrix.project }}
        working-directory: apps/web
      - name: Upload failed browser traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failure-traces-${{ matrix.project }}
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Branch protection requires this single result.
  checks:
    needs: [static, e2e]
    if: always()
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 2
    steps:
      - run: test "$STATIC" = success && test "$E2E" = success
        env:
          STATIC: ${{ needs.static.result }}
          E2E: ${{ needs.e2e.result }}
