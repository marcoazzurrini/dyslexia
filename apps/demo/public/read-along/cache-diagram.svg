<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" font-family="-apple-system, system-ui, sans-serif">
  <title>The app asks the cache first, and goes to the server only when the cache does not have the answer.</title>
  <rect width="640" height="280" rx="18" fill="#f4f4f8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#3a3a44"/>
    </marker>
  </defs>
  <g font-size="19" font-weight="600" fill="#1c1c1e" text-anchor="middle">
    <rect x="36" y="96" width="140" height="78" rx="14" fill="#ffffff" stroke="#c9c9d3"/>
    <text x="106" y="141">App</text>
    <rect x="250" y="96" width="140" height="78" rx="14" fill="#e6e5fb" stroke="#5856d6"/>
    <text x="320" y="141">Cache</text>
    <rect x="464" y="96" width="140" height="78" rx="14" fill="#ffffff" stroke="#c9c9d3"/>
    <text x="534" y="141">Server</text>
  </g>
  <g stroke="#3a3a44" stroke-width="2.2" fill="none" marker-end="url(#arrow)">
    <path d="M176 122h70"/>
    <path d="M390 122h70" stroke-dasharray="6 6"/>
    <path d="M250 150h-70"/>
  </g>
  <g font-size="14" fill="#4a4a55" text-anchor="middle">
    <text x="213" y="88">asks</text>
    <text x="427" y="88">only if missing</text>
    <text x="213" y="196">answers at once</text>
    <text x="320" y="238" font-size="15" fill="#5856d6">Kept close by, so most answers never wait for the network.</text>
  </g>
</svg>
