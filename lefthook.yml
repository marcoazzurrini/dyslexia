pre-commit:
  piped: true
  jobs:
    - name: format
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts,json,jsonc,css,html,md,mdx,yml,yaml}"
      exclude:
        - apps/web/src/routeTree.gen.ts
        - "**/package-lock.json"
        - bun.lock
      run: bunx oxfmt --write {staged_files}
      stage_fixed: true
    - name: lint
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts}"
      exclude:
        - apps/web/src/routeTree.gen.ts
      run: bunx oxlint --deny-warnings {staged_files}
    - name: typecheck
      run: bun run typecheck

pre-push:
  jobs:
    # Check a clean copy of the commit being pushed, as CI does. Ignored,
    # untracked, and uncommitted files, local secrets, and old build output
    # cannot make it pass.
    - name: checks on a clean copy of HEAD
      run: |
        set -e
        export CI=true
        dir=$(mktemp -d)
        trap 'git worktree remove --force "$dir"' EXIT
        git worktree add --detach --quiet "$dir" HEAD
        cd "$dir"
        bun install --frozen-lockfile
        bun run check
